      }).join('');
      return '<article class="card'+(qty?' in':'')+'" data-c="'+d.codigo+'">'
        + '<div class="photo"><img src="'+A+d.foto+'" alt="Media de compresión diseño #'+d.codigo+' '+d.nombre+' puesta" loading="lazy">'
        + '<span class="code">#'+d.codigo+'</span>'+(unica?'<span class="only">Solo '+d.tallas[0]+'</span>':'')
        + '<span class="qtybadge">'+qty+'</span></div>'
        + '<div class="cbody"><h3>'+d.nombre+'</h3><div class="price-line"><b>$45.000</b> · 3 por <b>$90.000</b></div>'
        + '<div class="sizes">'+sizes+'</div>'
        + '<button class="add" data-c="'+d.codigo+'"'+(sel?'':' disabled')+'>'+(sel?'Agregar':'Elige tu talla')+'</button></div></article>';
    }).join('');
    g.querySelectorAll('.sz').forEach(function(b){ b.onclick=function(){ pick[b.dataset.c]=b.dataset.t; var card=b.closest('.card'); card.querySelectorAll('.sz').forEach(function(x){x.setAttribute('aria-pressed',x===b);}); var a=card.querySelector('.add'); a.disabled=false; a.textContent='Agregar'; }; });
    g.querySelectorAll('.add').forEach(function(b){ b.onclick=function(){ add(b.dataset.c, pick[b.dataset.c], b); }; });
  }

  function qtyDiseno(c){ return cart.filter(function(x){return x.codigo===c;}).reduce(function(a,x){return a+x.qty;},0); }
  function add(c,t,btn){
    if(!t) return;
    if(nTotal()>=(C.maxMedias||99)){ if(btn){ btn.textContent='Máximo '+C.maxMedias+' por pedido'; setTimeout(function(){btn.textContent='Agregar';},1400); } return; }
    var dd=find(c);
    if(dd && dd.stock!==undefined && qtyDiseno(c)>=dd.stock){ if(btn){ btn.textContent='Máximo disponible'; setTimeout(function(){btn.textContent='Agregar';},1200); } return; }
    var l = cart.filter(function(x){return x.codigo===c && x.talla===t;})[0];
    if(l) l.qty++; else cart.push({codigo:c, talla:t, qty:1});
    save(); renderTray(); refreshBadges();
    if(btn){ var o=btn.textContent; btn.textContent='¡Agregada! ✓'; btn.classList.add('ok'); setTimeout(function(){btn.textContent='Agregar'; btn.classList.remove('ok');},900); }
    var tr=R.getElementById('tray'); tr.classList.remove('bump'); void tr.offsetWidth; tr.classList.add('bump');
  }
  function refreshBadges(){
    R.querySelectorAll('.card').forEach(function(card){
      var q = cart.filter(function(l){return l.codigo===card.dataset.c;}).reduce(function(a,l){return a+l.qty;},0);
      card.classList.toggle('in', q>0); card.querySelector('.qtybadge').textContent=q;
    });
  }

  // ---------- Bandeja ----------
  function nudgeText(n){
    if(!promoOn()) return '';
    var r=n%3;
    if(n===0) return 'Elige 3 medias y paga solo 2.';
    if(r===0) return '¡Combo completo! Te llevas 3 pagando 2 y ahorras $45.000 🎉';
    if(r===2) return 'Agrega 1 más y te llevas una GRATIS (ahorras $45.000).';
    return 'Agrega 2 más: pagas 2 y llevas 3.';
  }
  function renderTray(){
    var n=nTotal(), p=precio(n);
    var dots=''; var slots=Math.max(3, Math.ceil(n/3)*3);
    for(var i=1;i<=slots;i++){ dots += '<i class="'+(i<=n?'on':'')+(i%3===0?' free':'')+'"></i>'; }
    R.getElementById('dots').innerHTML = promoOn()? dots : '';
    R.getElementById('trayMsg').textContent = n? nudgeText(n) : (promoOn()?'Elige 3 medias y paga solo 2':'Elige tus medias');
    R.getElementById('trayTot').innerHTML = cop(p.total) + (p.ahorro? '<s>'+cop(p.reg)+'</s><em>Ahorras '+cop(p.ahorro)+'</em>' : '');
    var b=R.getElementById('trayBtn'); b.setAttribute('aria-disabled', n===0?'true':'false'); b.classList.toggle('off', n===0); if(n){ b.href=waUrl(); } else { b.removeAttribute('href'); }
  }

  // ---------- Hoja ----------
  function renderSheet(){
    var n=nTotal(), p=precio(n);
    var box=R.getElementById('lines');
    if(!n){ box.innerHTML='<p style="padding:18px 0;color:#666">Aún no has agregado medias.</p>'; }
    else box.innerHTML = cart.map(function(l,i){
      var d=find(l.codigo);
      return '<div class="line"><img src="'+A+d.foto+'" alt=""><div class="t">#'+d.codigo+' '+d.nombre+'<small>Talla '+l.talla+'</small></div>'
        + '<div class="qty"><button data-i="'+i+'" data-d="-1" aria-label="Quitar una">−</button><span>'+l.qty+'</span><button data-i="'+i+'" data-d="1" aria-label="Agregar una">+</button></div></div>';
    }).join('');
    box.querySelectorAll('.qty button').forEach(function(b){ b.onclick=function(){ var l=cart[+b.dataset.i]; var dd=find(l.codigo); if(+b.dataset.d>0 && nTotal()>=(C.maxMedias||99)) return; if(+b.dataset.d>0 && dd.stock!==undefined && qtyDiseno(l.codigo)>=dd.stock) return; l.qty+= +b.dataset.d; if(l.qty<=0) cart.splice(+b.dataset.i,1); save(); renderSheet(); renderTray(); refreshBadges(); if(!cart.length) closeSheet(); }; });
    var nd=R.getElementById('nudge'); var t=nudgeText(n); nd.textContent=t; nd.style.display=t?'block':'none';
    R.getElementById('sum').innerHTML =
      '<div><span>'+n+' media'+(n===1?'':'s')+' × $45.000</span><span>'+cop(p.reg)+'</span></div>'
      + (p.ahorro? '<div class="sv"><span>Promo Pague 2, lleve 3</span><span>−'+cop(p.ahorro)+'</span></div>':'')
      + '<div class="big"><span>Total</span><span>'+cop(p.total)+'</span></div>';
    refreshLinks();
  }
  function openSheet(){ if(!nTotal()) return; renderSheet(); refreshLinks(); R.getElementById('payStep').style.display='none'; R.getElementById('secure').style.display='none'; R.getElementById('sheetBg').classList.add('open'); }
  function closeSheet(){ R.getElementById('sheetBg').classList.remove('open'); }

  // ---------- WhatsApp ----------
  function refPedido(){ return 'KW-' + Date.now().toString(36).toUpperCase().slice(-5); }
  var REF = refPedido();
  function waUrl(){
    var n=nTotal(), p=precio(n);
    var txt = 'Hola Kuantik, quiero mi pedido:\n'
      + cart.map(function(l){ var d=find(l.codigo); return l.qty+'x #'+d.codigo+' '+d.nombre+' '+l.talla; }).join('\n')
      + '\nTotal '+cop(p.total) + (p.ahorro? ' (ahorro '+cop(p.ahorro)+')':'')
      + '\nNombre y ciudad:';
    return 'https://wa.me/'+C.whatsapp+'?text='+encodeURIComponent(txt);
  }
  function abrirWA(e){ return true; }
  // ---------- Pago: carrito de Odoo (Mercado Pago) ----------
  function porTalla(){ var m={}; cart.forEach(function(l){ m[l.talla]=(m[l.talla]||0)+l.qty; }); return m; }
  function irAlPago(){
    var base=C.tienda, mismoSitio=false;
    mismoSitio = /(^|\.)kuantik\.co$/.test(location.hostname); if(mismoSitio) base = location.origin;
    var tallas=porTalla(), keys=Object.keys(tallas);
    var btn=R.getElementById('payBtn');
    if(mismoSitio){
      btn.disabled=true; btn.textContent='Llevándote al pago…';
      keys.reduce(function(pr,t){
        return pr.then(function(){ return fetch(base+'/shop/cart/update_json',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'call',params:{product_id:C.variantes[t],add_qty:tallas[t],display:false}})}).then(function(r){ if(!r.ok) throw new Error('cart'); return r.json(); }); });
      }, Promise.resolve()).then(function(){ location.href = base + C.rutaCarrito; })
        .catch(function(){ btn.disabled=false; btn.textContent='Pagar ahora'; location.href = base + C.productoUrl + '#attr=' + C.atributoTalla[keys[0]]; });
    } else {
      // Vista previa fuera de kuantik.co: abre el producto de la tienda
      window.open(base + C.productoUrl + '#attr=' + C.atributoTalla[keys[0]], '_blank', 'noopener');
    }
  }
  function payUrl(){ var k=Object.keys(porTalla()); return C.tienda + C.productoUrl + '#attr=' + C.atributoTalla[k[0]||'S/M']; }
  function mismoSitio(){ try{ return location.origin===new URL(C.tienda).origin; }catch(e){ return false; } }
  function refreshLinks(){
    var w=R.getElementById('waBtn'), p=R.getElementById('payBtn');
    if(nTotal()){ w.href=waUrl(); p.href=payUrl(); }
  }
  function pagar(e){
    if(mismoSitio()){ e.preventDefault(); irAlPago(); }
    // fuera de kuantik.co: el enlace abre la tienda directamente
  }

  // ---------- Disponibilidad por talla en la guía ----------
  function renderAvail(){
    ['S/M','L/XL'].forEach(function(t){
      var cods = disenos.filter(function(d){return d.tallas.indexOf(t)>-1;}).map(function(d){return '#'+d.codigo;});
      var el=R.getElementById(t==='S/M'?'availSM':'availXL');
      el.textContent = cods.length? 'Disponible en: '+cods.join(', ') : 'Por ahora agotada';
    });
  }

  // ---------- Persistencia ligera (opcional) ----------
  function save(){ try{ localStorage.setItem('kuantik_combo', JSON.stringify(cart)); }catch(e){} }
  function load(){ try{ var s=JSON.parse(localStorage.getItem('kuantik_combo')||'[]'); cart = s.filter(function(l){ var d=disenos.filter(function(x){return x.codigo===l.codigo;})[0]; return d && d.tallas.indexOf(l.talla)>-1; }); }catch(e){ cart=[]; } }

  // ---------- Eventos ----------
  R.getElementById('trayBtn').onclick=function(e){ if(!nTotal()){ e.preventDefault(); R.getElementById('disenos').scrollIntoView({behavior:'smooth'}); } };
  R.getElementById('trayInfo').onclick=openSheet;
  R.getElementById('trayInfo').onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openSheet(); } };
  R.getElementById('sheetX').onclick=closeSheet;
  R.getElementById('sheetBg').onclick=function(e){ if(e.target.id==='sheetBg') closeSheet(); };
  R.getElementById('payBtn').onclick=pagar;
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheet(); });

  load(); applyPromoState(); renderCount(); setInterval(renderCount,1000);
  renderFilters(); renderGrid(); renderAvail(); renderTray();
})();
})();
//]]>
</script>
